version: "3.8"

services:
  router:
    build: .
    ports:
      - "8000:8000"
    env_file: .env
    depends_on:
      lmstudio:
        condition: service_healthy
    restart: unless-stopped

  lmstudio:
    image: ghcr.io/ggerganov/llama.cpp:server
    ports:
      - "1234:8080"
    volumes:
      - ./models:/models
    command: >-
      --model /models/qwen2.5-7b-instruct
      --host 0.0.0.0
      --port 8080
      --ctx-size 4096
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped
