# AI Cascade Router Configuration

# Local model (LM Studio)
local_model:
  base_url: "http://localhost:1234/v1"
  model_name: "auto"
  timeout_seconds: 300

# Cloud model (OpenRouter)
cloud_model:
  provider: "openrouter"
  model_name: "openai/gpt-4o-mini"
  base_url: "https://openrouter.ai/api/v1"

# Default max tokens (None = model decides)
max_tokens: null

# Routing configuration
routing:
  confidence_threshold: 0.7

  # Domain-specific thresholds (v0.2)
  domain_thresholds:
    code: 0.65        # Code generation - lower threshold (more local)
    analysis: 0.80    # Analysis - higher threshold (send to cloud)
    chat: 0.60        # Simple chat - very low threshold
    question: 0.55   # Questions - very low threshold
    creative: 0.70   # Creative writing - medium
    technical: 0.75   # Technical tasks - higher

  complexity:
    max_length_for_local: 200
    complex_keywords:
      - "анализ"
      - "сравни"
      - "объясни"
      - "напиши"
      - "код"
      - "программирование"
      - "задача"
      - "помоги"
      - "реши"
      - "create"
      - "analyze"
      - "compare"
      - "explain"
      - "debug"
      - "write code"
  task_types:
    code: "hybrid"
    analysis: "hybrid"
    simple: "local"
    question: "local"

# Cache configuration
cache:
  max_size_mb: 100
  ttl_responses: 3600
  ttl_computations: 86400

# Metrics configuration  
metrics:
  maintenance_cost_per_hour: 0.01
  cloud_cost_per_1k_tokens: 0.001

# Session / Context configuration
session:
  enabled: true
  ttl_minutes: 30
  max_context_tokens: 8192  # 8K — оптимально для кода. Для анализа/рефакторинга можно снизить до 4096